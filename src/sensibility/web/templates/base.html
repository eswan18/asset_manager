<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}{% endblock %} · {{ app_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Design tokens: docs/superpowers/specs/2026-10-26-frontend-redesign-design.md.
           The same values as the React app's frontend/src/styles/tokens.css
           (tests/test_spa.py checks they match). Templates name tokens, never
           hex values. Light is the default; dark follows the system setting. */
        :root {
            --bg: #F2F3F5;
            --surface: #FFFFFF;
            --ink: #15171A;
            --muted: #4A505A;
            --rule: #F0F1F3;
            --rule-strong: #DADDE2;
            --grid: #ECEEF1;
            --chip: #F2F3F5;
            --input: #FFFFFF;
            --asset: #2457C5;
            --asset-2: #8FB0EE;
            --asset-tint: #EEF3FC;
            --primary: #2457C5;
            --on-primary: #FFFFFF;
            --liability: #B4530F;
            --liability-2: #D9772E;
            --liability-3: #E9A066;
            --liability-4: #F3C79E;
            --leftover: #DCE6F8;
            --estimate-bg: #FFF4E5;
            --estimate-fg: #8A4B0C;
            --danger: #B42318;
            --danger-tint: #FDECEA;
            --bar-bg: #15171A;
            --bar-fg: #FFFFFF;
            --bar-muted: #B9BEC6;
            --bar-border: #15171A;
            --shadow: rgba(0, 0, 0, 0.06);
            --scrim: rgba(21, 23, 26, 0.35);

            --font-display: 'Space Grotesk', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, -apple-system, sans-serif;
            --radius-card: 20px;
            --radius-input: 10px;
            /* Layout: phones are max-width 600px (docs/superpowers/specs/2026-10-26-mobile-design.md).
               --tabbar-h is the bottom tab bar's height there, 0 elsewhere;
               anything fixed to the bottom of the screen sits above it. */
            --gutter: 24px;
            --tabbar-h: 0px;
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0F1115;
                --surface: #191C21;
                --ink: #ECEEF1;
                --muted: #9BA3AF;
                --rule: #23272E;
                --rule-strong: #3A404A;
                --grid: #262A31;
                --chip: #23272E;
                --input: #12151A;
                --asset: #6E9CF5;
                --asset-2: #34558F;
                --asset-tint: #1B2638;
                --primary: #6E9CF5;
                --on-primary: #0F1115;
                --liability: #F08C4A;
                --liability-2: #C46A2C;
                --liability-3: #8F4F24;
                --liability-4: #5E3A20;
                --leftover: #2C3B5C;
                --estimate-bg: #3A2A12;
                --estimate-fg: #F5C27A;
                --danger: #F97066;
                --danger-tint: #3A1C1A;
                --bar-bg: #2A2F37;
                --bar-fg: #ECEEF1;
                --bar-muted: #A9B0BA;
                --bar-border: #454B55;
                --shadow: rgba(0, 0, 0, 0.4);
                --scrim: rgba(0, 0, 0, 0.55);
                color-scheme: dark;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            font-size: 15px;
            font-variant-numeric: tabular-nums;
            background-color: var(--bg);
            color: var(--ink);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        a { color: var(--asset); }

        .wordmark {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 20px;
            color: var(--ink);
            text-decoration: none;
        }

        .container {
            max-width: 1160px;
            margin: 0 auto;
            padding: 8px var(--gutter) calc(64px + var(--tabbar-h));
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius-card);
            padding: 28px;
            display: flex;
            flex-direction: column;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 40px;
            padding: 0 18px;
            border: 1px solid transparent;
            border-radius: 999px;
            font: inherit;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--on-primary);
            font-weight: 600;
        }

        .btn-outline {
            background: transparent;
            color: var(--ink);
            border-color: var(--rule-strong);
        }

        .btn:focus-visible {
            outline: 2px solid var(--asset);
            outline-offset: 2px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in { animation: fadeUp 0.4s ease-out both; }

        @media (prefers-reduced-motion: reduce) {
            .fade-in { animation: none; }
        }

        /* Phones (docs/superpowers/specs/2026-10-26-mobile-design.md): 44px targets. */
        @media (max-width: 600px) {
            :root { --gutter: 16px; }
            .btn { min-height: 44px; }
        }

        {% block styles %}{% endblock %}
    </style>
</head>
{#- The one server-rendered page is login.html (board X); every other page is
    the React app (frontend/). So this is only the tokens and the few shared
    styles login uses: no shell, no scripts. -#}
<body>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
