<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}{% endblock %} · {{ app_name }}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#F4F3EE" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0D1412" media="(prefers-color-scheme: dark)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500..700&display=swap" rel="stylesheet">
    <style>
        /* Design tokens: docs/superpowers/specs/2026-10-26-frontend-redesign-design.md.
           The same values as the React app's frontend/src/styles/tokens.css
           (tests/test_spa.py checks they match). Templates name tokens, never
           hex values. Light is the default; dark follows the system setting. */
        :root {
            --bg: #F4F3EE;
            --surface: #FFFFFF;
            --ink: #13211D;
            --muted: #4C5753;
            --rule: #EFEEE9;
            --rule-strong: #D9D9D1;
            --grid: #EAE9E3;
            --chip: #F4F3EE;
            --input: #FFFFFF;
            --asset: #17694F;
            --asset-2: #8CC4AC;
            --asset-tint: #EAF3EE;
            --primary: #053C32;
            --on-primary: #FFFFFF;
            --liability: #B4530F;
            --liability-2: #D9772E;
            --liability-3: #E9A066;
            --liability-4: #F3C79E;
            --leftover: #D9ECE2;
            --estimate-bg: #FFF4E5;
            --estimate-fg: #8A4B0C;
            --danger: #B42318;
            --danger-tint: #FDECEA;
            --bar-bg: #13211D;
            --bar-fg: #FFFFFF;
            --bar-muted: #B5BEBA;
            --bar-border: #13211D;
            --shadow: rgba(0, 0, 0, 0.06);
            --scrim: rgba(19, 33, 29, 0.35);

            --font-display: 'Source Serif 4', Georgia, serif;
            --font-body: 'Inter', system-ui, -apple-system, sans-serif;
            --radius-card: 20px;
            --radius-input: 10px;
            /* Layout: phones are max-width 600px (docs/superpowers/specs/2026-10-26-mobile-design.md).
               --tabbar-h is the bottom tab bar's height there, 0 elsewhere;
               anything fixed to the bottom of the screen sits above it. */
            --gutter: 24px;
            --tabbar-h: 0px;
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0D1412;
                --surface: #161F1C;
                --ink: #E9EEEB;
                --muted: #9AA6A1;
                --rule: #212B28;
                --rule-strong: #374440;
                --grid: #24302C;
                --chip: #212B28;
                --input: #111816;
                --asset: #5EC29B;
                --asset-2: #2B6A53;
                --asset-tint: #16302A;
                --primary: #5EC29B;
                --on-primary: #0D1412;
                --liability: #F08C4A;
                --liability-2: #C46A2C;
                --liability-3: #8F4F24;
                --liability-4: #5E3A20;
                --leftover: #1F3B31;
                --estimate-bg: #3A2A12;
                --estimate-fg: #F5C27A;
                --danger: #F97066;
                --danger-tint: #3A1C1A;
                --bar-bg: #25302C;
                --bar-fg: #E9EEEB;
                --bar-muted: #A8B3AE;
                --bar-border: #3F4C47;
                --shadow: rgba(0, 0, 0, 0.4);
                --scrim: rgba(0, 0, 0, 0.55);
                color-scheme: dark;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            font-size: 15px;
            font-variant-numeric: tabular-nums;
            background-color: var(--bg);
            color: var(--ink);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        a { color: var(--asset); }

        /* The brand lockup (the React app's Logo): the coin, then the
           outlined wordmark as a mask filled with --ink, so it follows the
           theme. Both files are the React build's, served from the root. */
        .wordmark {
            display: inline-flex;
            align-items: center;
            align-self: flex-start;
            gap: 8px;
        }

        .wordmark img {
            width: 30px;
            height: 30px;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        .wordmark-text {
            height: 21px;
            aspect-ratio: 1740 / 378;
            background: var(--ink);
            mask: url(/wordmark.svg) center / contain no-repeat;
        }

        .container {
            max-width: 1160px;
            margin: 0 auto;
            padding: 8px var(--gutter) calc(64px + var(--tabbar-h));
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius-card);
            padding: 28px;
            display: flex;
            flex-direction: column;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 40px;
            padding: 0 18px;
            border: 1px solid transparent;
            border-radius: 999px;
            font: inherit;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--on-primary);
            font-weight: 600;
        }

        .btn-outline {
            background: transparent;
            color: var(--ink);
            border-color: var(--rule-strong);
        }

        .btn:focus-visible {
            outline: 2px solid var(--asset);
            outline-offset: 2px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in { animation: fadeUp 0.4s ease-out both; }

        @media (prefers-reduced-motion: reduce) {
            .fade-in { animation: none; }
        }

        /* Phones (docs/superpowers/specs/2026-10-26-mobile-design.md): 44px targets. */
        @media (max-width: 600px) {
            :root { --gutter: 16px; }
            .btn { min-height: 44px; }
        }

        {% block styles %}{% endblock %}
    </style>
</head>
{#- The one server-rendered page is login.html (board X); every other page is
    the React app (frontend/). So this is only the tokens and the few shared
    styles login uses: no shell, no scripts. -#}
<body>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
