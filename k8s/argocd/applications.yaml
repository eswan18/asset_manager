apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sensibility-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/eswan18/sensibility
    targetRevision: main
    path: k8s/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: sensibility-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sensibility-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/eswan18/sensibility
    targetRevision: main
    path: k8s/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: sensibility-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
