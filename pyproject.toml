[tool.pytest.ini_options]
minversion = "4.0"
addopts = "--cov=asset_manager"
filterwarnings = ["error"]
markers = [
    "db: marks tests as database tests (require testcontainers)",
]

[tool.ruff.lint]
# ruff 0.17 widened the default rule set; keep the pre-0.17 defaults so the
# upgrade is not mixed with a lint-policy change.
select = ["E4", "E7", "E9", "F"]

[project]
name = "asset_manager"
version = "0.3.0"
description = "Track personal financial assets and liabilities"
authors = [{name = "Ethan Swan", email = "ethanpswan@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "authlib>=1.9.1",
    "fastapi>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "plotly>=7.1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "typer>=0.27.3",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
asset-manager = "asset_manager.cli:main"
app = "asset_manager.web.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asset_manager"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.9",
    "ipython>=9.17.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "testcontainers[postgres]>=4.15.0",
    "ty>=0.0.91",
]
