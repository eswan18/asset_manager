[tool.pytest.ini_options]
minversion = "4.0"
# Browser tests need Chromium installed; run them with `uv run pytest -m browser`.
addopts = "--cov=sensibility -m 'not browser'"
filterwarnings = ["error"]
markers = [
    "db: marks tests as database tests (require testcontainers)",
    "browser: real-browser tests (Playwright Chromium); excluded by default",
]

[tool.ruff.lint]
# ruff 0.17 widened the default rule set; keep the pre-0.17 defaults so the
# upgrade is not mixed with a lint-policy change.
select = ["E4", "E7", "E9", "F"]

[project]
name = "sensibility"
version = "0.3.0"
description = "Track personal financial assets and liabilities"
authors = [{name = "Ethan Swan", email = "ethanpswan@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "authlib>=1.9.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "mcp==2.3.0",
    "plotly>=7.1.0",
    "psycopg-pool>=3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.10.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "typer>=0.27.3",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
sensibility = "sensibility.cli:main"
app = "sensibility.web.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensibility"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.9",
    "ipython>=9.17.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.2",
    "testcontainers[postgres]>=4.15.0",
    "ty>=0.0.91",
]
